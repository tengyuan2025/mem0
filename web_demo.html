<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mem0 智能记忆系统 - Web演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 1200px;
            padding: 30px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }
        
        .config-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .config-row {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }
        
        .config-item {
            flex: 1;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }
        
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .tab {
            padding: 10px 20px;
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            position: relative;
        }
        
        .tab.active {
            color: #667eea;
        }
        
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: #667eea;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 500px;
        }
        
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message-content {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 10px;
            word-wrap: break-word;
        }
        
        .message.user .message-content {
            background: #667eea;
            color: white;
        }
        
        .message.assistant .message-content {
            background: #e8e8e8;
            color: #333;
        }
        
        .message-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
        }
        
        .input-group input {
            flex: 1;
        }
        
        button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #5a67d8;
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .memory-item {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }
        
        .memory-content {
            color: #333;
            margin-bottom: 10px;
        }
        
        .memory-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #999;
        }
        
        .search-section {
            margin-bottom: 20px;
        }
        
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .search-bar input {
            flex: 1;
        }
        
        .results {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .status {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        
        .score-badge {
            background: #667eea;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 Mem0 智能记忆系统</h1>
        
        <!-- 配置部分 -->
        <div class="config-section">
            <div class="config-row">
                <div class="config-item">
                    <label for="apiUrl">API地址</label>
                    <input type="text" id="apiUrl" value="http://localhost:8000" placeholder="http://localhost:8000">
                </div>
                <div class="config-item">
                    <label for="apiKey">API密钥</label>
                    <input type="password" id="apiKey" value="your-secret-key-change-this" placeholder="输入API密钥">
                </div>
                <div class="config-item">
                    <label for="userId">用户ID</label>
                    <input type="text" id="userId" value="demo_user_001" placeholder="输入用户ID">
                </div>
            </div>
        </div>
        
        <!-- 状态提示 -->
        <div id="status" class="status"></div>
        
        <!-- 标签页 -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('chat')">💬 智能对话</button>
            <button class="tab" onclick="switchTab('memory')">📚 记忆管理</button>
            <button class="tab" onclick="switchTab('search')">🔍 记忆搜索</button>
        </div>
        
        <!-- 聊天标签页 -->
        <div id="chat-tab" class="tab-content active">
            <div class="chat-container">
                <div id="messages" class="messages">
                    <div class="message assistant">
                        <div>
                            <div class="message-label">助手</div>
                            <div class="message-content">
                                你好！我是您的智能助手，我会记住我们的对话内容。有什么可以帮助您的吗？
                            </div>
                        </div>
                    </div>
                </div>
                <div class="input-group">
                    <input type="text" id="chatInput" placeholder="输入消息..." onkeypress="if(event.key==='Enter') sendMessage()">
                    <label style="display: flex; align-items: center; margin: 0 10px;">
                        <input type="checkbox" id="useMemory" checked> 使用记忆
                    </label>
                    <button onclick="sendMessage()">发送</button>
                </div>
            </div>
        </div>
        
        <!-- 记忆管理标签页 -->
        <div id="memory-tab" class="tab-content">
            <div style="margin-bottom: 20px;">
                <button onclick="loadUserMemories()">刷新记忆列表</button>
                <button onclick="clearAllMemories()" style="background: #dc3545; margin-left: 10px;">清空所有记忆</button>
            </div>
            <div id="memoryList" class="results">
                <div class="loading">点击"刷新记忆列表"加载用户记忆</div>
            </div>
        </div>
        
        <!-- 记忆搜索标签页 -->
        <div id="search-tab" class="tab-content">
            <div class="search-section">
                <div class="search-bar">
                    <input type="text" id="searchQuery" placeholder="搜索记忆内容..." onkeypress="if(event.key==='Enter') searchMemories()">
                    <button onclick="searchMemories()">搜索</button>
                </div>
                <div id="searchResults" class="results">
                    <div class="loading">输入关键词搜索记忆</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // API配置
        function getApiConfig() {
            return {
                baseUrl: document.getElementById('apiUrl').value,
                apiKey: document.getElementById('apiKey').value,
                userId: document.getElementById('userId').value
            };
        }
        
        // 显示状态消息
        function showStatus(message, type = 'success') {
            const status = document.getElementById('status');
            status.className = `status ${type}`;
            status.textContent = message;
            setTimeout(() => {
                status.className = 'status';
            }, 3000);
        }
        
        // 切换标签页
        function switchTab(tabName) {
            // 更新标签按钮状态
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // 显示对应内容
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(`${tabName}-tab`).classList.add('active');
        }
        
        // 发送聊天消息
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message) return;
            
            const config = getApiConfig();
            const useMemory = document.getElementById('useMemory').checked;
            const messagesDiv = document.getElementById('messages');
            
            // 添加用户消息
            messagesDiv.innerHTML += `
                <div class="message user">
                    <div>
                        <div class="message-label">您</div>
                        <div class="message-content">${message}</div>
                    </div>
                </div>
            `;
            
            input.value = '';
            input.disabled = true;
            
            // 添加加载提示
            const loadingId = 'loading-' + Date.now();
            messagesDiv.innerHTML += `
                <div id="${loadingId}" class="message assistant">
                    <div>
                        <div class="message-label">助手</div>
                        <div class="message-content">正在思考...</div>
                    </div>
                </div>
            `;
            
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            
            try {
                const response = await fetch(`${config.baseUrl}/api/v1/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${config.apiKey}`
                    },
                    body: JSON.stringify({
                        user_id: config.userId,
                        message: message,
                        use_memory: useMemory
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                // 移除加载提示，添加回复
                document.getElementById(loadingId).outerHTML = `
                    <div class="message assistant">
                        <div>
                            <div class="message-label">助手 ${useMemory ? '(使用记忆)' : '(不使用记忆)'}</div>
                            <div class="message-content">${data.response}</div>
                        </div>
                    </div>
                `;
                
                showStatus('消息发送成功');
            } catch (error) {
                document.getElementById(loadingId).remove();
                showStatus(`发送失败: ${error.message}`, 'error');
            } finally {
                input.disabled = false;
                input.focus();
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }
        }
        
        // 加载用户记忆
        async function loadUserMemories() {
            const config = getApiConfig();
            const memoryList = document.getElementById('memoryList');
            
            memoryList.innerHTML = '<div class="loading">加载中...</div>';
            
            try {
                const response = await fetch(`${config.baseUrl}/api/v1/users/${config.userId}/memories?limit=50`, {
                    headers: {
                        'Authorization': `Bearer ${config.apiKey}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.memories && data.memories.length > 0) {
                    memoryList.innerHTML = data.memories.map(memory => `
                        <div class="memory-item">
                            <div class="memory-content">${memory.content || '无内容'}</div>
                            <div class="memory-meta">
                                <span>ID: ${memory.memory_id}</span>
                                <span>创建时间: ${new Date(memory.metadata?.created_at).toLocaleString('zh-CN')}</span>
                            </div>
                        </div>
                    `).join('');
                    showStatus(`加载了 ${data.count} 条记忆`);
                } else {
                    memoryList.innerHTML = '<div class="loading">暂无记忆</div>';
                }
            } catch (error) {
                memoryList.innerHTML = `<div class="loading">加载失败: ${error.message}</div>`;
                showStatus(`加载失败: ${error.message}`, 'error');
            }
        }
        
        // 搜索记忆
        async function searchMemories() {
            const config = getApiConfig();
            const query = document.getElementById('searchQuery').value.trim();
            if (!query) {
                showStatus('请输入搜索关键词', 'error');
                return;
            }
            
            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = '<div class="loading">搜索中...</div>';
            
            try {
                const response = await fetch(`${config.baseUrl}/api/v1/memories/search`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${config.apiKey}`
                    },
                    body: JSON.stringify({
                        user_id: config.userId,
                        query: query,
                        limit: 10
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const results = await response.json();
                
                if (results && results.length > 0) {
                    resultsDiv.innerHTML = results.map(memory => `
                        <div class="memory-item">
                            <div class="memory-content">${memory.content}</div>
                            <div class="memory-meta">
                                <span>相关度: <span class="score-badge">${(memory.score * 100).toFixed(1)}%</span></span>
                                <span>创建时间: ${new Date(memory.metadata?.created_at).toLocaleString('zh-CN')}</span>
                            </div>
                        </div>
                    `).join('');
                    showStatus(`找到 ${results.length} 条相关记忆`);
                } else {
                    resultsDiv.innerHTML = '<div class="loading">未找到相关记忆</div>';
                }
            } catch (error) {
                resultsDiv.innerHTML = `<div class="loading">搜索失败: ${error.message}</div>`;
                showStatus(`搜索失败: ${error.message}`, 'error');
            }
        }
        
        // 清空所有记忆
        async function clearAllMemories() {
            if (!confirm('确定要清空该用户的所有记忆吗？此操作不可恢复！')) {
                return;
            }
            
            const config = getApiConfig();
            
            try {
                const response = await fetch(`${config.baseUrl}/api/v1/memories/delete`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${config.apiKey}`
                    },
                    body: JSON.stringify({
                        user_id: config.userId
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                showStatus('所有记忆已清空');
                loadUserMemories();
            } catch (error) {
                showStatus(`清空失败: ${error.message}`, 'error');
            }
        }
        
        // 页面加载完成后
        document.addEventListener('DOMContentLoaded', () => {
            // 聚焦输入框
            document.getElementById('chatInput').focus();
        });
    </script>
</body>
</html>
