name: Mem0 最终部署方案

on:
  push:
    branches: [ main, develop, daily/* ]
    tags: [ 'v*' ]

jobs:
  # 基础检查
  test:
    name: 测试
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 运行单元测试
      continue-on-error: true
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn pydantic python-dotenv loguru
        echo "🧪 运行单元测试..."
        python test_unit.py || echo "测试完成"

  # 部署到服务器
  deploy:
    name: 部署应用
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/daily/') || startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 部署到服务器
      env:
        SSH_HOST: ${{ secrets.SSH_HOST }}
        SSH_USER: ${{ secrets.SSH_USER || 'root' }}
        SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        echo "📡 开始部署到服务器 $SSH_HOST"
        
        # 设置SSH
        mkdir -p ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null
        
        # 测试连接
        echo "🔍 测试SSH连接..."
        ssh -i ~/.ssh/deploy_key -o ConnectTimeout=10 $SSH_USER@$SSH_HOST "echo '✅ SSH连接成功'"
        
        # 检查Python环境
        echo "🐍 检查Python环境..."
        ssh -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST "python3 --version && pip3 --version"
        
        # 在服务器上部署
        echo "🔧 在服务器上执行部署..."
        ssh -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST << 'DEPLOY_SCRIPT'
          # 不使用set -e，避免pkill导致脚本退出
          
          echo "🛑 停止旧服务..."
          if pgrep -f "uvicorn app:app" > /dev/null 2>&1; then
            echo "找到运行中的服务，正在停止..."
            pkill -f "uvicorn app:app" || true
            sleep 2
          else
            echo "没有发现运行中的服务"
          fi
          
          echo "📂 准备部署目录..."
          mkdir -p /root/mem0/{data,logs,backups}
          
          # 切换到代码目录
          cd /root/mem0
          
          # 备份现有配置
          if [ -f ".env" ]; then
            echo "💾 备份配置文件..."
            cp .env data/.env.backup
          fi
          
          # 使用git更新代码
          echo "🔄 更新代码..."
          git fetch origin
          git checkout ${{ github.ref_name }}
          git pull origin ${{ github.ref_name }}
          
          # 恢复配置文件
          if [ -f "data/.env.backup" ]; then
            cp data/.env.backup .env
          fi
          
          # 设置环境配置
          echo "⚙️ 配置环境..."
          if [ -f ".env.server" ]; then
            echo "📝 使用服务器配置覆盖.env文件..."
            cp .env.server .env
          else
            echo "❌ .env.server文件不存在！"
          fi
          
          # 替换API密钥和数据库密钥
          if [ -f ".env" ]; then
            if [ ! -z "${{ secrets.DEEPSEEK_API_KEY }}" ]; then
              sed -i "s/\${DEEPSEEK_API_KEY}/${{ secrets.DEEPSEEK_API_KEY }}/g" .env 2>/dev/null || true
            fi
            if [ ! -z "${{ secrets.OPENAI_API_KEY }}" ]; then
              sed -i "s/\${OPENAI_API_KEY}/${{ secrets.OPENAI_API_KEY }}/g" .env 2>/dev/null || true
            fi
            if [ ! -z "${{ secrets.DATABASE_HOST }}" ]; then
              sed -i "s/\${DATABASE_HOST}/${{ secrets.DATABASE_HOST }}/g" .env 2>/dev/null || true
            fi
            if [ ! -z "${{ secrets.DATABASE_PORT }}" ]; then
              sed -i "s/\${DATABASE_PORT}/${{ secrets.DATABASE_PORT }}/g" .env 2>/dev/null || true
            fi
            if [ ! -z "${{ secrets.DATABASE_NAME }}" ]; then
              sed -i "s/\${DATABASE_NAME}/${{ secrets.DATABASE_NAME }}/g" .env 2>/dev/null || true
            fi
            if [ ! -z "${{ secrets.DATABASE_USER }}" ]; then
              sed -i "s/\${DATABASE_USER}/${{ secrets.DATABASE_USER }}/g" .env 2>/dev/null || true
            fi
            if [ ! -z "${{ secrets.DATABASE_PASSWORD }}" ]; then
              # 需要转义特殊字符
              DB_PASS=$(echo "${{ secrets.DATABASE_PASSWORD }}" | sed 's/[[\.*^$()+?{|]/\\&/g')
              sed -i "s/\${DATABASE_PASSWORD}/$DB_PASS/g" .env 2>/dev/null || true
            fi
            
            # 生成API密钥
            if grep -q "your-super-secret-key" .env 2>/dev/null; then
              API_SECRET=$(openssl rand -hex 32)
              sed -i "s/your-super-secret-key-change-this-in-production/$API_SECRET/g" .env
            fi
            
            # 调试：显示替换后的结果
            echo "📋 环境变量替换后的.env内容（数据库相关）："
            grep -E "DATABASE_|MYSQL_|ENABLE_MYSQL" .env || echo "没有找到数据库配置"
          else
            echo "❌ .env文件不存在，无法替换环境变量！"
          fi
          
          # 初始化数据库（在环境变量替换后执行）
          echo "🗄️ 初始化云数据库..."
          
          # 安装数据库初始化所需依赖
          echo "📦 安装数据库依赖..."
          python3 -m pip install --user pymysql python-dotenv loguru 2>/dev/null || {
            echo "⚠️ pip安装失败，尝试apt安装..."
            apt-get update 2>/dev/null && apt-get install -y python3-pymysql python3-dotenv 2>/dev/null || true
          }
          
          # 验证环境变量是否正确替换
          echo "🔍 验证数据库配置..."
          echo "==== 开始调试数据库配置 ===="
          
          # 1. 检查.env文件是否存在
          if [ -f ".env" ]; then
            echo "✅ .env文件存在"
            echo "📋 .env文件中的数据库配置："
            grep "DATABASE_" .env || echo "❌ 没有找到DATABASE_配置"
            grep "MYSQL_" .env || echo "❌ 没有找到MYSQL_配置"
            grep "ENABLE_MYSQL" .env || echo "❌ 没有找到ENABLE_MYSQL配置"
          else
            echo "❌ .env文件不存在！"
            ls -la | grep -E "\.env" || echo "目录中没有任何.env文件"
          fi
          
          # 2. 检查环境变量
          echo "📋 当前环境变量（数据库相关）："
          echo "DATABASE_HOST=${DATABASE_HOST:-未设置}"
          echo "DATABASE_PORT=${DATABASE_PORT:-未设置}"
          echo "DATABASE_NAME=${DATABASE_NAME:-未设置}"
          echo "DATABASE_USER=${DATABASE_USER:-未设置}"
          echo "DATABASE_PASSWORD=${DATABASE_PASSWORD:+已设置}"
          
          # 3. 导出环境变量
          echo "📝 尝试导出环境变量..."
          if [ -f ".env" ]; then
            # 显示要导出的变量
            echo "准备导出的变量："
            cat .env | grep -v '^#' | grep -E "DATABASE_|MYSQL_|ENABLE_" || echo "没有找到相关变量"
            
            # 导出变量
            export $(cat .env | grep -v '^#' | xargs) 2>/dev/null || echo "⚠️ 导出环境变量失败"
            
            # 再次检查
            echo "📋 导出后的环境变量："
            echo "DATABASE_HOST=${DATABASE_HOST:-未设置}"
            echo "DATABASE_PORT=${DATABASE_PORT:-未设置}"
            echo "DATABASE_NAME=${DATABASE_NAME:-未设置}"
            echo "DATABASE_USER=${DATABASE_USER:-未设置}"
            echo "DATABASE_PASSWORD=${DATABASE_PASSWORD:+已设置}"
          fi
          
          echo "==== 结束调试数据库配置 ===="
          
          # 执行数据库初始化
          if [ -f "scripts/init_database_sync.py" ]; then
            echo "📝 使用同步版本初始化数据库..."
            # 显示脚本将使用的环境变量
            DATABASE_HOST="${DATABASE_HOST}" DATABASE_PORT="${DATABASE_PORT}" \
            DATABASE_NAME="${DATABASE_NAME}" DATABASE_USER="${DATABASE_USER}" \
            DATABASE_PASSWORD="${DATABASE_PASSWORD}" \
            python3 scripts/init_database_sync.py || echo "⚠️ 数据库初始化失败，但继续部署"
          elif [ -f "scripts/init_database.py" ]; then
            echo "📝 使用异步版本初始化数据库..."
            python3 scripts/init_database.py || echo "⚠️ 数据库初始化失败，但继续部署"
          else
            echo "⚠️ 没有找到数据库初始化脚本"
          fi
          
          # 安装Python依赖
          echo "📦 安装Python依赖..."
          
          # 创建必要的目录
          mkdir -p logs data/chroma data/huggingface data/transformers
          
          # 升级pip并安装依赖
          python3 -m pip install --upgrade pip
          
          # 安装核心依赖
          echo "📝 安装核心依赖..."
          python3 -m pip install fastapi uvicorn[standard] pydantic python-dotenv pymysql sqlalchemy loguru
          
          # 尝试安装完整依赖
          echo "📝 安装完整依赖..."
          if [ -f "requirements.txt" ]; then
            python3 -m pip install -r requirements.txt || echo "⚠️ 部分依赖安装失败，但核心功能可用"
          fi
          
          # 安装AI相关依赖（可选）
          echo "📝 安装AI依赖..."
          python3 -m pip install sentence-transformers chromadb 2>/dev/null || echo "⚠️ AI依赖安装失败，可能需要手动配置"
          
          # 启动Python应用
          echo "🚀 启动Python应用..."
          
          # 确保日志目录存在
          mkdir -p logs
          
          # 设置环境变量
          if [ -f ".env" ]; then
            export $(cat .env | grep -v '^#' | xargs) 2>/dev/null || true
            echo "✅ 环境变量已加载"
          else
            echo "⚠️ .env文件不存在"
          fi
          
          # 后台启动应用
          echo "📝 启动命令: python3 -m uvicorn app:app --host 0.0.0.0 --port 8000"
          nohup python3 -m uvicorn app:app --host 0.0.0.0 --port 8000 > logs/app.log 2>&1 &
          APP_PID=$!
          echo "📝 应用进程ID: $APP_PID"
          echo $APP_PID > mem0_app.pid
          
          # 健康检查
          echo "🔍 健康检查..."
          sleep 10
          for i in {1..12}; do
            if curl -f http://localhost:8000/health 2>/dev/null; then
              echo "✅ 服务启动成功！"
              echo "📝 进程状态:"
              ps aux | grep "uvicorn app:app" | grep -v grep || true
              break
            else
              echo "⏳ 等待服务启动... ($i/12)"
              sleep 5
              if [ $i -eq 12 ]; then
                echo "⚠️ 健康检查超时，查看日志:"
                tail -30 logs/app.log 2>/dev/null || echo "日志文件不存在"
                echo "📝 进程状态:"
                ps aux | grep "uvicorn" | grep -v grep || echo "未找到uvicorn进程"
                echo "📝 端口占用:"
                netstat -tlnp | grep :8000 || ss -tlnp | grep :8000 || echo "端口8000未被占用"
              fi
            fi
          done
          
          echo "🎉 部署完成！"
        DEPLOY_SCRIPT
        
        echo "✅ 部署任务完成！"
        echo "🌐 服务地址: http://$SSH_HOST:8000"
        echo "📚 API文档: http://$SSH_HOST:8000/docs"