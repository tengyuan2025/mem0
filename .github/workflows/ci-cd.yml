name: Mem0 CI/CD Pipeline

on:
  push:
    branches: [ main, develop, daily/* ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: 3.11

jobs:
  # 代码质量检查
  lint-and-test:
    name: 代码检查和测试
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov black isort flake8 bandit safety
        
    - name: 代码格式检查
      run: |
        black --check --diff .
        isort --check-only --diff .
        
    - name: 代码质量检查
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: 安全漏洞扫描
      run: |
        bandit -r . -x ./venv,./data,./logs
        safety check --json || true
        
    - name: 运行测试
      run: |
        python -m pytest -v --cov=mem0 --cov-report=xml --cov-report=html
        
    - name: 上传覆盖率报告
      uses: codecov/codecov-action@v3
      if: matrix.python-version == '3.11'
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  # 安全扫描
  security-scan:
    name: 安全扫描
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 运行Trivy漏洞扫描
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: 上传Trivy扫描结果到GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # 构建Docker镜像
  build-image:
    name: 构建Docker镜像
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scan]
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: 登录到容器注册表
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: 提取元数据
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha,prefix=git-
          type=raw,value=latest,enable={{is_default_branch}}
          
    - name: 构建和推送Docker镜像
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.prod
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          VCS_REF=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
          VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          
    - name: 输出镜像信息
      id: image
      run: |
        echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_OUTPUT

  # 镜像安全扫描
  scan-image:
    name: 镜像安全扫描
    runs-on: ubuntu-latest
    needs: build-image
    if: github.event_name != 'pull_request'
    
    steps:
    - name: 运行Trivy镜像扫描
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ needs.build-image.outputs.image }}@${{ needs.build-image.outputs.digest }}'
        format: 'sarif'
        output: 'trivy-image-results.sarif'
        
    - name: 上传镜像扫描结果
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-image-results.sarif'

  # 部署到测试环境
  deploy-staging:
    name: 部署到测试环境
    runs-on: ubuntu-latest
    needs: [build-image, scan-image]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.mem0.example.com
      
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 部署到测试环境
      uses: ./.github/actions/deploy
      with:
        environment: staging
        image: ${{ needs.build-image.outputs.image }}@${{ needs.build-image.outputs.digest }}
        ssh-private-key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        ssh-host: ${{ secrets.STAGING_SSH_HOST }}
        ssh-user: ${{ secrets.STAGING_SSH_USER }}
        
    - name: 运行冒烟测试
      run: |
        sleep 30  # 等待服务启动
        curl -f https://staging.mem0.example.com/health || exit 1
        python test_api.py --base-url https://staging.mem0.example.com || true

  # 部署到生产环境
  deploy-production:
    name: 部署到生产环境
    runs-on: ubuntu-latest
    needs: [build-image, scan-image]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    environment:
      name: production
      url: https://api.mem0.example.com
      
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 部署到生产环境
      uses: ./.github/actions/deploy
      with:
        environment: production
        image: ${{ needs.build-image.outputs.image }}@${{ needs.build-image.outputs.digest }}
        ssh-private-key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
        ssh-host: ${{ secrets.PRODUCTION_SSH_HOST }}
        ssh-user: ${{ secrets.PRODUCTION_SSH_USER }}
        
    - name: 运行健康检查
      run: |
        sleep 60  # 等待服务完全启动
        curl -f https://api.mem0.example.com/health || exit 1
        
    - name: 通知部署成功
      if: success()
      run: |
        echo "🎉 生产环境部署成功！"
        echo "版本: ${{ github.ref_name }}"
        echo "镜像: ${{ needs.build-image.outputs.image }}@${{ needs.build-image.outputs.digest }}"

  # 清理旧镜像
  cleanup:
    name: 清理旧镜像
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always() && github.event_name == 'push'
    
    steps:
    - name: 清理未使用的镜像
      uses: actions/delete-package-versions@v4
      with:
        package-name: ${{ env.IMAGE_NAME }}
        package-type: 'container'
        min-versions-to-keep: 10
        delete-only-untagged-versions: true