name: Mem0 简化版CI/CD

on:
  push:
    branches: [ main, develop, daily/* ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 基础检查和测试
  test:
    name: 测试
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        # 安装基础依赖进行测试
        pip install fastapi uvicorn[standard] pydantic python-dotenv loguru httpx
        pip install python-jose[cryptography] passlib[bcrypt]
        # 尝试安装AI相关依赖（允许失败）
        pip install sentence-transformers || echo "sentence-transformers安装失败，跳过"
        pip install chromadb || echo "chromadb安装失败，跳过"
        pip install sqlalchemy pymysql || echo "数据库依赖安装失败，跳过"
        
    - name: 代码格式检查（可选）
      continue-on-error: true
      run: |
        pip install black isort flake8
        black --check --diff . || true
        isort --check-only --diff . || true
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
        
    - name: 运行单元测试
      continue-on-error: true
      run: |
        echo "🧪 运行单元测试..."
        python test_unit.py
        
        echo "📝 运行代码语法检查..."
        python -m py_compile app.py || echo "app.py 语法检查失败"
        python -m py_compile mysql_handler.py || echo "mysql_handler.py 语法检查失败"
        
        echo "✅ 单元测试完成"

  # 构建Docker镜像
  build:
    name: 构建镜像
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    
    outputs:
      image: ${{ steps.image.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
      
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: 登录GitHub容器注册表
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: 提取元数据
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}
          
    - name: 构建和推送Docker镜像
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.simple
        platforms: linux/amd64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: 输出镜像信息
      id: image
      run: |
        echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_OUTPUT
        echo "🎉 镜像构建成功: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

  # 部署到服务器（需要配置secrets）
  deploy:
    name: 部署应用
    runs-on: ubuntu-latest
    needs: build
    # 在main分支、daily分支或标签推送时部署
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/daily/') || startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置部署环境
      id: set-env
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "environment=staging" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          echo "environment=production" >> $GITHUB_OUTPUT
        fi
        
    - name: 检查SSH配置
      run: |
        if [ -z "${{ secrets.SSH_HOST }}" ]; then
          echo "❌ 未配置 SSH_HOST"
          echo "请在 GitHub Settings -> Secrets 中添加 SSH_HOST"
          exit 1
        else
          echo "✅ SSH_HOST 已配置"
        fi
        
        if [ -z "${{ secrets.SSH_USER }}" ]; then
          echo "⚠️ 未配置 SSH_USER，使用默认值 root"
        else
          echo "✅ SSH_USER 已配置"
        fi
        
        if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
          echo "❌ 未配置 SSH_PRIVATE_KEY"
          echo "请在 GitHub Settings -> Secrets 中添加 SSH_PRIVATE_KEY"
          exit 1
        else
          echo "✅ SSH_PRIVATE_KEY 已配置"
        fi
    
    - name: 部署到服务器
      env:
        SSH_HOST: ${{ secrets.SSH_HOST }}
        SSH_USER: ${{ secrets.SSH_USER || 'root' }}
        SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        echo "📡 连接到服务器 $SSH_HOST"
        
        # 设置SSH
        mkdir -p ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        
        # 添加服务器到已知主机
        ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null
        
        # 测试连接
        echo "🔍 测试SSH连接..."
        if ssh -i ~/.ssh/deploy_key -o ConnectTimeout=10 $SSH_USER@$SSH_HOST "echo '✅ SSH连接成功'"; then
          echo "SSH连接正常"
        else
          echo "❌ SSH连接失败"
          echo "请检查："
          echo "1. SSH_HOST 是否正确"
          echo "2. SSH_USER 是否正确"
          echo "3. SSH_PRIVATE_KEY 是否正确"
          echo "4. 服务器防火墙是否允许SSH"
          exit 1
        fi
        
        # 检查Docker
        echo "🐳 检查Docker安装..."
        if ssh -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST "which docker"; then
          echo "✅ Docker已安装"
        else
          echo "❌ Docker未安装，尝试安装..."
          ssh -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST << 'INSTALL_DOCKER'
            # 安装Docker（阿里云镜像）
            curl -fsSL https://get.docker.com | bash -s docker --mirror Aliyun
            systemctl start docker
            systemctl enable docker
            
            # 安装Docker Compose
            curl -L "https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            chmod +x /usr/local/bin/docker-compose
            
            echo "Docker安装完成"
            docker --version
            docker-compose --version
        INSTALL_DOCKER
        fi
        
        # 执行部署
        echo "🚀 开始部署应用..."
        ssh -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST << 'DEPLOY'
          set -e
          
          echo "📂 准备部署环境..."
          
          # 创建临时目录进行代码更新
          TEMP_DIR="/tmp/mem0_deploy_$(date +%Y%m%d_%H%M%S)"
          mkdir -p "$TEMP_DIR"
          
          echo "📥 下载最新代码到临时目录..."
          cd "$TEMP_DIR"
          git clone https://github.com/${{ github.repository }}.git .
          git checkout ${{ github.ref_name }}
          
          echo "🔄 同步代码到生产目录..."
          # 创建生产目录
          mkdir -p /opt/mem0/{data,logs,backups}
          
          # 停止旧容器（如果存在）
          echo "🛑 停止旧容器..."
          docker stop mem0-api 2>/dev/null || echo "没有运行的容器"
          docker rm mem0-api 2>/dev/null || echo "没有要删除的容器"
          
          # 备份重要数据
          if [ -f "/opt/mem0/.env" ]; then
            echo "💾 备份环境配置..."
            cp /opt/mem0/.env /opt/mem0/data/.env.backup
          fi
          
          # 同步代码文件（保留数据目录）
          rsync -av --exclude='data/' --exclude='logs/' --exclude='backups/' \
                --exclude='.env' "$TEMP_DIR/" /opt/mem0/
          
          # 切换到生产目录
          cd /opt/mem0
          chmod +x scripts/deployment/*.sh 2>/dev/null || true
          
          # 设置环境配置
          echo "⚙️ 配置环境变量..."
          if [ -f ".env.server" ]; then
            cp .env.server .env
            echo "使用 .env.server 配置"
          elif [ -f ".env.production.template" ]; then
            cp .env.production.template .env
            echo "使用 .env.production.template 配置"
          fi
          
          # 替换环境变量占位符
          if [ ! -z "${{ secrets.DEEPSEEK_API_KEY }}" ]; then
            sed -i "s/\${DEEPSEEK_API_KEY}/${{ secrets.DEEPSEEK_API_KEY }}/g" .env
          fi
          if [ ! -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            sed -i "s/\${OPENAI_API_KEY}/${{ secrets.OPENAI_API_KEY }}/g" .env
          fi
          
          # 生成随机API密钥（如果没有设置）
          if grep -q "your-super-secret-key-change-this" .env; then
            API_SECRET=$(openssl rand -hex 32)
            sed -i "s/your-super-secret-key-change-this-in-production/$API_SECRET/g" .env
            echo "✅ 已生成随机API密钥"
          fi
          
          # 停止旧容器
          echo "🛑 停止旧容器..."
          docker stop mem0-api 2>/dev/null || echo "没有运行的容器"
          docker rm mem0-api 2>/dev/null || echo "没有要删除的容器"
          
          # 构建新镜像
          echo "🏗️ 构建应用镜像..."
          if [ -f "Dockerfile.simple" ]; then
            docker build -f Dockerfile.simple -t mem0:latest .
          else
            docker build -t mem0:latest .
          fi
          
          # 运行新容器
          echo "🚀 启动新容器..."
          docker run -d \
            --name mem0-api \
            -p 8000:8000 \
            --restart always \
            --env-file .env \
            -v /opt/mem0/data:/app/data \
            -v /opt/mem0/logs:/app/logs \
            mem0:latest
          
          # 等待服务启动
          echo "⏳ 等待服务启动..."
          sleep 10
          
          # 检查服务状态
          echo "🔍 检查服务状态..."
          docker ps | grep mem0-api
          
          # 测试API健康检查
          if curl -f http://localhost:8000/health 2>/dev/null; then
            echo "✅ API健康检查通过"
          else
            echo "⚠️ API健康检查失败，查看日志..."
            docker logs --tail 20 mem0-api
          fi
          
          echo "🎉 部署完成！"
          echo "服务地址: http://$(curl -s ifconfig.me):8000"
          
          # 清理临时目录
          echo "🧹 清理临时文件..."
          rm -rf "$TEMP_DIR"
        DEPLOY

  # 通知部署结果（可选）
  notify:
    name: 通知
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()
    
    steps:
    - name: 部署成功通知
      if: success()
      run: |
        echo "✅ 部署成功!"
        echo "分支/标签: ${{ github.ref_name }}"
        echo "提交: ${{ github.sha }}"
        echo "触发者: ${{ github.actor }}"
        
    - name: 部署失败通知
      if: failure()
      run: |
        echo "❌ 部署失败!"
        echo "请检查GitHub Actions日志"