name: Mem0 简化版CI/CD

on:
  push:
    branches: [ main, develop, daily/* ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 基础检查和测试
  test:
    name: 测试
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 代码格式检查（可选）
      continue-on-error: true
      run: |
        pip install black isort flake8
        black --check --diff . || true
        isort --check-only --diff . || true
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
        
    - name: 运行基础测试
      continue-on-error: true
      run: |
        # 如果有测试文件，运行测试
        if [ -f "test_api.py" ]; then
          python test_api.py || true
        fi
        if [ -f "test_chinese.py" ]; then
          python test_chinese.py || true
        fi

  # 构建Docker镜像
  build:
    name: 构建镜像
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    
    outputs:
      image: ${{ steps.image.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
      
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: 登录GitHub容器注册表
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: 提取元数据
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}
          
    - name: 构建和推送Docker镜像
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.prod
        platforms: linux/amd64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: 输出镜像信息
      id: image
      run: |
        echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_OUTPUT
        echo "🎉 镜像构建成功: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

  # 部署到服务器（需要配置secrets）
  deploy:
    name: 部署应用
    runs-on: ubuntu-latest
    needs: build
    # 只在主分支或标签推送时部署
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置部署环境
      id: set-env
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "environment=staging" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          echo "environment=production" >> $GITHUB_OUTPUT
        fi
        
    - name: 部署到服务器
      if: env.SSH_HOST != ''
      env:
        SSH_HOST: ${{ secrets.SSH_HOST }}
        SSH_USER: ${{ secrets.SSH_USER }}
        SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        # 检查是否配置了SSH
        if [ -z "$SSH_HOST" ]; then
          echo "⚠️ 未配置SSH连接信息，跳过部署"
          exit 0
        fi
        
        # 设置SSH
        mkdir -p ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts
        
        # 执行部署
        ssh -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST << 'EOF'
          cd /opt/mem0
          git pull origin main
          docker-compose -f docker-compose.prod.yml pull
          docker-compose -f docker-compose.prod.yml up -d
          docker-compose -f docker-compose.prod.yml ps
        EOF
        
        echo "🚀 部署完成！"

  # 通知部署结果（可选）
  notify:
    name: 通知
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()
    
    steps:
    - name: 部署成功通知
      if: success()
      run: |
        echo "✅ 部署成功!"
        echo "分支/标签: ${{ github.ref_name }}"
        echo "提交: ${{ github.sha }}"
        echo "触发者: ${{ github.actor }}"
        
    - name: 部署失败通知
      if: failure()
      run: |
        echo "❌ 部署失败!"
        echo "请检查GitHub Actions日志"