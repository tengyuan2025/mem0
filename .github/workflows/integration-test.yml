name: 集成测试（可选）

on:
  workflow_dispatch:  # 手动触发
  schedule:
    - cron: '0 0 * * *'  # 每天运行一次

jobs:
  integration-test:
    name: 集成测试
    runs-on: ubuntu-latest
    
    services:
      # 启动测试用的数据库服务
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test123
          POSTGRES_DB: mem0_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn[standard] pydantic python-dotenv
        pip install sqlalchemy pymysql psycopg2-binary
        pip install requests pytest
        
    - name: 设置测试环境
      run: |
        cat > .env.test << EOF
        API_SECRET_KEY=test-secret-key
        DATABASE_URL=postgresql://postgres:test123@localhost:5432/mem0_test
        MEM0_EMBEDDER_MODEL=all-MiniLM-L6-v2
        MEM0_VECTOR_STORE_PROVIDER=faiss
        APP_PORT=8000
        LOG_LEVEL=INFO
        EOF
        
    - name: 启动API服务
      run: |
        cp .env.test .env
        uvicorn app:app --host 0.0.0.0 --port 8000 &
        sleep 10
        
    - name: 等待服务启动
      run: |
        for i in {1..30}; do
          if curl -f http://localhost:8000/health 2>/dev/null; then
            echo "✅ 服务启动成功"
            break
          fi
          echo "等待服务启动... ($i/30)"
          sleep 2
        done
        
    - name: 运行集成测试
      run: |
        # 修改测试脚本的API地址为localhost
        if [ -f "test_chinese.py" ]; then
          sed -i 's/127.0.0.1/localhost/g' test_chinese.py
          python test_chinese.py || true
        fi
        
        if [ -f "test_api.py" ]; then
          sed -i 's/127.0.0.1/localhost/g' test_api.py
          python test_api.py || true
        fi